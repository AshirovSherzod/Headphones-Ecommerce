name: Quality and demo deployment

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: demo-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: "22"
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v7.0.1
              if: failure()
              with:
                  name: browser-test-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
            - run: npm run build
            - uses: actions/upload-pages-artifact@v5.0.0
              if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
              with:
                  path: dist

    deploy:
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        needs: check
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Publish demo
              id: deployment
              uses: actions/deploy-pages@v5.0.1
